# SSC Prep Hub — Local Infrastructure (PostgreSQL + Redis + Meilisearch)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sscprephub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sscprephub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sscprephub-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: sscprephub-meilisearch
    environment:
      MEILI_MASTER_KEY: "MasterKeyForSearch123"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  redisdata:
  meilidata:
