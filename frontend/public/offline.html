<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d4ed8" />
<title>Offline | SSC Prep Hub</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6fb; --card:#fff; --fg:#0f172a; --muted:#64748b; --primary:#1d4ed8; --border:#e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#141a2e; --fg:#e8edf7; --muted:#9aa6bd; --primary:#6ea0ff; --border:#232b44; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
         font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px; text-align:center;
          box-shadow:0 12px 32px -14px rgba(15,23,42,.25); }
  .ico { width:56px; height:56px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center; background:rgba(29,78,216,.1); color:var(--primary); }
  h1 { font-size:20px; margin:0 0 6px; } p { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.55; }
  a, button { display:block; width:100%; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:600; text-decoration:none; cursor:pointer; border:1px solid var(--border);
              background:transparent; color:var(--fg); margin-top:10px; font-family:inherit; }
  .primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  @media (prefers-color-scheme: dark) { .primary { color:#0b1020; } }
</style>
</head>
<body>
  <main class="card">
    <div class="ico">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>This page was not saved on your device yet. Your downloaded practice packs and saved pages still work. Connect to the internet to load everything.</p>
    <a class="primary" href="/offline">Open offline practice</a>
    <a href="/dashboard">Go to dashboard</a>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
