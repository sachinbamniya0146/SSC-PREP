services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ssc_prep_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
    volumes:
      - meilisearch_data:/data.ms
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ssc_prep_hub?schema=public&connection_limit=20"
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: masterKey
      PORT: 4000
      JWT_SECRET: dev-secret-change-in-production-32chars-minimum
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-32chars-minimum
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-32chars-minimum
      ADMIN_EMAIL: admin@sscprephub.in
      ADMIN_PASSWORD: Admin@123456
      ADMIN_PASSWORDS: '["Admin@123456"]'
      OPENROUTER_API_KEY: ""
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  meilisearch_data:
