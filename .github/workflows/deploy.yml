# Build on GitHub (fast, 7 GB RAM) -> push images to GHCR -> the VPS only pulls + restarts (about a minute).
# The VPS never compiles Next.js / TypeScript any more.
# Images are built for BOTH linux/amd64 (old x86 VPS) and linux/arm64 (Oracle Ampere A1), so the same tag runs on either.
# arm64 is built with QEMU emulation on the x86 runner, so a build takes longer (hence the 90 min timeout).
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button — builds and deploys the selected branch's latest commit

env:
  REGISTRY_OWNER: sachinbamniya0146
  NEXT_PUBLIC_API_BASE_URL: https://sscprephub.in/api/v1
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: 449330513452-02oguopf78aldfio3r2pa98dujkbkheo.apps.googleusercontent.com

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sachinbamniya0146/ssc-prep-backend:${{ github.sha }}
            ghcr.io/sachinbamniya0146/ssc-prep-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The public VAPID key is baked into the frontend at build time. Use the repo variable if it is set,
      # otherwise read it from the server's .env (same value the old on-server build used).
      - name: Setup SSH (to read the public VAPID key)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Resolve VAPID public key
        id: vapid
        env:
          FROM_VAR: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          key="$FROM_VAR"
          if [ -z "$key" ]; then
            raw=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "grep -m1 '^VAPID_PUBLIC_KEY=' /opt/ssc-prep-hub/.env" 2>/dev/null || true)
            key=$(printf '%s' "${raw#VAPID_PUBLIC_KEY=}" | tr -d "\"' \r")
          fi
          if [ -z "$key" ]; then
            echo "::warning::VAPID public key not found - push notifications will not work in this build. Set the repo variable NEXT_PUBLIC_VAPID_PUBLIC_KEY."
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sachinbamniya0146/ssc-prep-frontend:${{ github.sha }}
            ghcr.io/sachinbamniya0146/ssc-prep-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ steps.vapid.outputs.key }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS (pull + restart)
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60   # first pull of big images on the small VPS can take a while
    permissions:
      contents: read
      packages: read
    # deploys queue one after another; a deploy that has started is never cancelled
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Verify SSH connection
        run: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH ok' && hostname"

      - name: Make sure .env exists on the server
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          # The secret travels over stdin (never inside the command string), so quotes / $ / newlines in it are safe.
          printf '%s' "$PRODUCTION_ENV" | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/ssc-prep-hub
            if [ ! -f .env ]; then
              echo "Creating .env from the PRODUCTION_ENV secret..."
              cat > .env
              chmod 600 .env
            else
              cat > /dev/null
              echo ".env already exists - leaving it untouched"
            fi
          '

      # Lets the server pull the private images. Uses the GHCR_PULL_TOKEN secret (a PAT with read:packages) if you
      # added one, otherwise this run's own token.
      - name: Log the server in to GHCR
        env:
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$PULL_TOKEN" | ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"

      # The server's checkout is synced HERE (before deploy.sh starts), so the very first run after a change never
      # executes an old deploy.sh that git replaces halfway through.
      #
      # ROOT-CAUSE FIX (error: unable to unlink old 'searxng/settings.yml': Permission denied):
      # the SearXNG container chowns the bind-mounted ./searxng folder to its own user, so the normal server user can
      # no longer overwrite searxng/settings.yml and `git reset --hard` dies. The ownership is now handed back to the
      # deploy user BEFORE git touches anything (the old fix lived inside deploy.sh, which only runs AFTER the reset).
      - name: Deploy
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            echo "🚀 Deploy attempt $attempt/3 (image tag $DEPLOY_SHA)"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                 "$DEPLOY_TARGET" "DEPLOY_SHA='$DEPLOY_SHA' DEPLOY_REPO='$DEPLOY_REPO' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/ssc-prep-hub

          # 1) give ./searxng back to the deploy user (the SearXNG container re-owns it on every start)
          if [ -d searxng ] && [ -n "$(find searxng ! -user "$(id -un)" -print -quit 2>/dev/null)" ]; then
            echo "🔧 Fixing ownership of ./searxng (owned by the container user)"
            ME="$(id -u):$(id -g)"
            sudo -n chown -R "$ME" searxng 2>/dev/null \
              || docker run --rm -v "$PWD/searxng:/s" alpine chown -R "$ME" /s 2>/dev/null \
              || docker run --rm --entrypoint chown -v "$PWD/searxng:/s" searxng/searxng:latest -R "$ME" /s
          fi

          # 2) sync the checkout to the exact commit that was built (falls back to origin/main)
          git remote set-url origin "https://github.com/${DEPLOY_REPO}.git"
          git fetch --prune origin main
          if git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then TARGET="$DEPLOY_SHA"; else TARGET="origin/main"; fi
          git reset --hard "$TARGET"

          # 3) deploy (checkout is already synced, so deploy.sh must not sync again)
          chmod +x deploy.sh
          DEPLOY_SYNCED=1 IMAGE_TAG="$DEPLOY_SHA" ./deploy.sh < /dev/null
          REMOTE
            then
              echo "✅ Deployed"; exit 0
            fi
            [ "$attempt" -lt 3 ] && { echo "⚠️ failed, retrying in 30s"; sleep 30; }
          done
          echo "❌ All attempts failed"; exit 1

      - name: Verify the live site
        run: |
          for attempt in 1 2 3 4 5; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
              curl -sf -o /dev/null --max-time 30 https://sscprephub.in &&
              curl -sf -o /dev/null --max-time 30 https://sscprephub.in/api/v1/health"; then
              echo "✅ Site is up"; exit 0
            fi
            echo "⚠️ not ready yet ($attempt/5)"; sleep 20
          done
          echo "❌ Site did not come up"; exit 1
