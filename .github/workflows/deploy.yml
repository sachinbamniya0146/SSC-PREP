name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger — always deploys immediately, no debounce

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # DEBOUNCE: collapse a burst of pushes into a single deploy per quiet hour.
  #
  # Problem this solves: pushing 3-4 files 5-8 minutes apart used to trigger
  # 3-4 separate deploys back to back. Instead, every push now waits 60
  # minutes before deploying, and each new push during that wait CANCELS the
  # previous wait (via the `concurrency` group below) and starts its own
  # fresh 60-minute timer. Only the push that ends up being the last one for
  # a full hour survives its wait and proceeds to deploy — carrying whatever
  # is the latest commit on `main` at that point (so nothing is ever lost;
  # in-between commits just ride along in the same deploy instead of each
  # triggering their own).
  #
  # Manual runs (workflow_dispatch) skip this entirely and deploy right away
  # — that's an explicit human decision to deploy now, not a batchable push.
  debounce:
    name: Debounce (wait for a quiet hour)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 75
    # Only one debounce wait may be "in flight" at a time. When a new push
    # arrives while a previous one is still waiting, cancel-in-progress
    # kills the older wait and this new run becomes the one that decides
    # whether to deploy — this is what gives the "1 push per hour" effect
    # even if commits land every 5-8 minutes.
    concurrency:
      group: production-deploy-debounce
      cancel-in-progress: true
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Wait 60 minutes for the push burst to settle
        run: |
          echo "⏳ Waiting 60 minutes to see if more pushes land (commit: ${{ github.sha }})"
          sleep 3600

      - name: Check whether this is still the latest commit on main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')
          echo "This run's commit:   ${{ github.sha }}"
          echo "Latest commit on main: $latest_sha"
          if [ "$latest_sha" = "${{ github.sha }}" ]; then
            echo "✅ No newer push landed during the wait — proceeding to deploy."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            # This should be rare in practice (cancel-in-progress normally
            # stops us before we even get here), but it's a safe fallback
            # for any timing edge-case around the API/cancellation race.
            echo "⏭️ A newer commit exists on main — that push's own debounce run will handle the deploy. Skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to VPS
    needs: debounce
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.debounce.outputs.should_deploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Deploys themselves still run one-at-a-time and queue rather than
    # overlap (a debounced deploy and a manual workflow_dispatch could in
    # theory land close together) — but never cancel a deploy that has
    # already started.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Verify SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH connection successful' && hostname"

      - name: Copy production env file
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd /opt/ssc-prep-hub && 
            if [ ! -f .env ]; then
              echo 'Creating .env from template...'
              printf '%s' \"$PRODUCTION_ENV\" > .env
            fi
          "

      - name: Run deployment script with retry
        id: deploy
        run: |
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            echo "🚀 Deployment attempt $((retry_count + 1))/$max_retries"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST}} "
              cd /opt/ssc-prep-hub &&
              chmod +x deploy.sh &&
              ./deploy.sh
            "; then
              echo "✅ Deployment succeeded"
              exit 0
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Deployment failed, retrying in 60 seconds..."
                sleep 60
              else
                echo "❌ All deployment attempts failed"
                exit 1
              fi
            fi
          done
        timeout-minutes: 80

      - name: Verify deployment with retry
        if: success()
        run: |
          max_retries=5
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            echo "🔍 Verification attempt $((retry_count + 1))/$max_retries"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
              sleep 15 &&
              curl -sf -o /dev/null -w '%{http_code}' --max-time 30 https://sscprephub.in | grep -q '^200$' &&
              curl -sf -o /dev/null -w '%{http_code}' --max-time 30 https://sscprephub.in/api/v1/health | grep -q '^200$'
            "; then
              echo "✅ Deployment verification PASSED"
              exit 0
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Verification failed, retrying in 30 seconds..."
                sleep 30
              else
                echo "❌ All verification attempts failed"
                exit 1
              fi
            fi
          done
        timeout-minutes: 10

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [debounce, deploy]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "Deployment failed for commit ${{ github.sha }}"
          echo "Check GitHub Actions for details"
          # Add Slack/Discord/Email notification here if needed
