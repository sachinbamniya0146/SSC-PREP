# HTTP - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sscprephub.in www.sscprephub.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sscprephub.in www.sscprephub.in;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # FIX (Sep 2026 — Cashfree "Failed to load Cashfree SDK" bug): this CSP
    # header still allowlisted PayU's domains from before the gateway
    # migration to Cashfree, and never allowlisted any Cashfree domain at
    # all. script-src/connect-src/frame-src blocking https://sdk.cashfree.com
    # is EXACTLY what makes the browser throw "Failed to load Cashfree SDK"
    # in premium/page.tsx's loadCashfreeSdk() — the script tag's onerror
    # fires because the browser's own security policy refused the request,
    # which looks identical to a real network failure from the user's side.
    # Domains below match Cashfree's own documented CSP requirements
    # (github.com/cashfree/cashfree-js) for their v3 checkout SDK.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://api.cashfree.com https://sandbox.cashfree.com; frame-src 'self' https://accounts.google.com https://sdk.cashfree.com https://api.cashfree.com https://sandbox.cashfree.com https://payments.cashfree.com https://payments-test.cashfree.com;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Backend API — bulk question upload (Excel/CSV/JSON/Word)
    #
    # BUGFIX ("bahut der tak Uploading dikhta hai, phir kuch nahi batata"):
    # a large sheet (Sachin's SSC_CGL_MASTER_PLUS, 650+ rows) takes each row
    # through a duplicate-check DB query + a create() write inside
    # BankUploadService — comfortably longer than the general API's 90s
    # proxy_read_timeout for a few hundred rows. When nginx hit that 90s
    # ceiling it silently killed the still-in-progress upstream connection;
    # the browser never got a response (success OR error), so the "Uploading..."
    # button just sat there forever with no error message — indistinguishable
    # from a genuine hang. This location gives ONLY the upload endpoints a
    # much longer timeout so a real multi-hundred-row upload has time to
    # finish and return its actual result (created/failed counts + per-row
    # errors) instead of being cut off mid-flight. Every other API route
    # keeps the original 90s via the /api/v1/ block below (unaffected).
    location /api/v1/bank/admin/upload/ {
        proxy_pass http://backend:4000/api/v1/bank/admin/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 25m;
    }

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        
        # Handle WebSocket connections for real-time features
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /api/v1/health {
        proxy_pass http://backend:4000/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Static assets with caching
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public files (PDFs, images)
    location /files/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }
}