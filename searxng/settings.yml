# SSCPrepHub — self-hosted SearXNG (free, no API key, no daily limit).
# Only reachable inside the docker network (no public port). JSON format is needed by the backend.
# Small VPS (1 GB RAM): only a few light engines, generous timeouts, so one search does not starve the CPU.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - bing
      - google
      - brave
      - startpage
      - mojeek
general:
  instance_name: "ssc-search"
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  # SEARXNG_SECRET env (set in docker-compose) overrides this placeholder
  secret_key: "change-me-via-env"
  limiter: false
  image_proxy: false
  public_instance: false
outgoing:
  request_timeout: 12.0
  max_request_timeout: 18.0
  pool_connections: 20
  pool_maxsize: 10
